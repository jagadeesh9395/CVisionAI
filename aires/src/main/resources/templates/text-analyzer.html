<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <h1 class="text-center mb-4">AI Text Analyzer</h1>
        
        <div class="row g-3">
            <!-- Input Column -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Input Text</h5>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <textarea id="inputText" class="form-control flex-grow-1" 
                                 placeholder="Enter text to analyze..."></textarea>
                    </div>
                </div>
            </div>
            
            <!-- JSON Schema Column -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">JSON Schema</h5>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <textarea id="jsonSchema" class="form-control flex-grow-1" 
                                 placeholder='{"key": "value"}'>{
  "summary": "string",
  "keyPoints": ["string"],
  "sentiment": {
    "score": "number",
    "label": "string"
  },
  "entities": [
    {
      "type": "string",
      "value": "string"
    }
  ]
}</textarea>
                    </div>
                </div>
            </div>
            
            <!-- Results Column -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Analysis Results</h5>
                        <button id="copyBtn" class="btn btn-sm btn-outline-light">
                            <i class="bi bi-clipboard"></i> Copy
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="loadingIndicator" class="text-center d-none">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Analyzing text...</p>
                        </div>
                        <div id="resultsContainer">
                            <!-- Dynamic content will be inserted here -->
                            <div class="text-muted text-center my-5">
                                <i class="bi bi-arrow-left" style="font-size: 2rem;"></i>
                                <p class="mt-2">Enter text and click "Analyze" to see results</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button id="analyzeBtn" class="btn btn-primary w-100">
                            <span id="analyzeText">Analyze Text</span>
                            <span id="analyzeSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/text-analyzer.js"></script>
</body>
</html>
