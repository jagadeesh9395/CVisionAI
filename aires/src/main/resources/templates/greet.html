<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice to meet you - CVisionAI</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="../static/css/main.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content animate-fade">
            <div class="hero-content">
                <div class="illustration">
                    <img src="../static/images/welcome.png" th:src="@{/images/welcome.png}" alt="Welcome">
                    <!-- Placeholder if image not found -->
                    <div th:if="${false}">
                         <svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="200" cy="200" r="150" fill="#fef3c7" />
                            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="20">Hello!</text>
                         </svg>
                    </div>
                </div>
                <div class="info-text">
                    <h2>Nice to meet you, <span th:text="${fullName}">Jagadeeshwar Karanam</span></h2>
                    <p th:if="${latestCompany != null}">
                        You are currently a <b th:text="${latestCompany.role}">Senior Software Engineer</b> 
                        at <b th:text="${latestCompany.name}">Monocept Pvt Ltd</b>
                        <span th:if="${latestCompany.location != null}"> in <b th:text="${latestCompany.location}">Hyderabad</b></span>.
                    </p>
                    <p th:if="${latestCompany != null and latestCompany.duration != null}">
                        Duration: <b th:text="${latestCompany.duration}">9th June 2023 – 31st October 2023</b>
                    </p>
                    <p>We will help you build an impressive resume that highlights your professional experience and skills.</p>
                    
                    <a th:href="@{/analysis}" href="/analysis" class="btn btn-primary" style="margin-top: 2rem; padding: 1rem 3rem; font-size: 1.1rem;">Continue to Build Resume</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
