<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVisionAI - Upload Your Resume</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" href="../static/css/main.css" />
    <!-- Fallback for local preview -->
  </head>
  <body>
    <div class="app-container">
      <main class="main-content animate-fade">
        <div class="upload-section">
          <header class="page-header">
            <h1>Upload your resume</h1>
          </header>

          <div class="upload-grid">
            <form id="uploadForm" th:action="@{/builder/upload}" method="post" enctype="multipart/form-data" style="display: none;">
              <input type="file" name="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.rtf,.html" onchange="handleFileSelect(this)">
            </form>
            
            <div class="file-acceptance-area">
              <div class="drop-zone" id="dropZone">
                <div class="upload-icon">
                  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                  </svg>
                </div>
                <p id="dropText">Drag & drop your file here or <span class="browse-link" onclick="document.getElementById('fileInput').click()">browse</span></p>
                <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 1rem">
                  Acceptable file types: DOC, DOCX, PDF, HTML, RTF, TXT
                </p>
                
                <!-- File info will be displayed here -->
                <div id="fileInfo" class="file-info" style="display: none; margin-top: 1.5rem;">
                  <div class="file-details">
                    <div class="file-icon">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                      </svg>
                    </div>
                    <div class="file-meta">
                      <span id="fileName" class="file-name"></span>
                      <span id="fileSize" class="file-size"></span>
                    </div>
                  </div>
                  <button type="button" class="btn btn-ghost btn-sm" onclick="clearFile()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <line x1="18" y1="6" x2="6" y2="18"></line>
                      <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Removed old drop zone as it's now part of the file-acceptance-area -->

            <div class="or-divider">OR</div>

            <div class="cloud-options">
              <button class="btn btn-outline" disabled style="opacity: 0.5;">
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/7/78/Dropbox_Icon.svg"
                  width="20"
                  alt="Dropbox"
                />
                Dropbox
              </button>
              <button class="btn btn-outline" disabled style="opacity: 0.5;">
                <img
                  src="https://upload.wikimedia.org/wikipedia/commons/1/12/Google_Drive_icon_%282020%29.svg"
                  width="20"
                  alt="Google Drive"
                />
                Google Drive
              </button>
            </div>
          </div>

          <div class="footer-actions">
            <a
              th:href="@{/builder-basics}"
              class="btn btn-ghost"
              style="color: var(--primary); font-weight: 600"
              >Create a new resume</a
            >
            <button
              id="uploadBtn"
              class="btn btn-primary"
              style="
                background-color: #e2e8f0;
                color: #94a3b8;
                cursor: not-allowed;
              "
              disabled
              onclick="submitUpload()"
            >
              Upload
            </button>
          </div>

          <footer
            style="
              margin-top: 4rem;
              font-size: 0.75rem;
              color: #64748b;
              text-align: center;
            "
          >
            By clicking any of the actions listed here, you agree to our
            <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.
          </footer>
        </div>
      </main>
    </div>

    <style>
      .file-acceptance-area {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
      }
      
      .drop-zone {
        border: 2px dashed #e2e8f0;
        border-radius: 0.5rem;
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: #fff;
      }
      
      .drop-zone:hover {
        border-color: #cbd5e1;
      }
      
      .upload-icon {
        margin-bottom: 1rem;
        color: #64748b;
      }
      
      .browse-link {
        color: #3b82f6;
        text-decoration: underline;
        cursor: pointer;
      }
      
      .browse-link:hover {
        color: #2563eb;
      }
      
      .file-info {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
      }
      
      .file-details {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex: 1;
      }
      
      .file-icon {
        color: #64748b;
      }
      
      .file-meta {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      
      .file-name {
        font-weight: 500;
        color: #1e293b;
        font-size: 0.875rem;
      }
      
      .file-size {
        font-size: 0.75rem;
        color: #64748b;
      }
      
      .btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      
      .btn-ghost {
        background: transparent;
        border: none;
        color: #64748b;
        padding: 0.25rem;
        border-radius: 0.25rem;
      }
      
      .btn-ghost:hover {
        background-color: #f1f5f9;
      }
    </style>

    <script>
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const uploadBtn = document.getElementById('uploadBtn');
      const fileInfo = document.getElementById('fileInfo');
      const fileName = document.getElementById('fileName');
      const fileSize = document.getElementById('fileSize');

      function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }

      let selectedFile = null;

      function handleFileSelect(input) {
        if (input.files && input.files[0]) {
          const file = input.files[0];
          fileName.textContent = file.name;
          fileSize.textContent = formatFileSize(file.size);
          fileInfo.style.display = 'flex';
          // Enable the upload button when a file is selected
          uploadBtn.disabled = false;
          uploadBtn.style.opacity = '1';
          uploadBtn.style.backgroundColor = '#f59e0b';
          uploadBtn.style.color = '#1f2937';
          uploadBtn.style.cursor = 'pointer';
        }
      }

      function clearFile() {
        fileInput.value = '';
        fileInfo.style.display = 'none';
        uploadBtn.disabled = true;
        uploadBtn.style.opacity = '0.5';
      }

      function enableUploadButton() {
        uploadBtn.disabled = false;
        uploadBtn.style.opacity = '1';
        uploadBtn.onclick = submitUpload;
      }

      function submitUpload() {
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        
        if (fileInput.files && fileInput.files[0]) {
          // Disable the upload button and show loading state
          uploadBtn.disabled = true;
          uploadBtn.style.opacity = '0.7';
          uploadBtn.style.cursor = 'not-allowed';
          uploadBtn.innerHTML = '<span class="spinner"></span> Uploading...';
          
          // Submit the form
          form.submit();
          
          // Prevent multiple submissions
          uploadBtn.onclick = null;
        }
      }

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--primary)';
        dropZone.style.backgroundColor = '#f0f7ff';
        document.getElementById('dropText').textContent = 'Drop your file here';
      });

      dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#e2e8f0';
        dropZone.style.backgroundColor = '#fff';
        document.getElementById('dropText').textContent = 'Drag & drop your file here';
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#e2e8f0';
        dropZone.style.backgroundColor = '#fff';
        document.getElementById('dropText').textContent = 'Drag & drop your file here or browse';
        
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          fileInput.files = files;
          handleFileSelect(fileInput);
        }
      });
      
      // Handle click on the drop zone to open file dialog
      dropZone.addEventListener('click', (e) => {
        // Only trigger file input if the click wasn't on a button or link
        if (e.target === dropZone || e.target.tagName === 'P' || e.target.tagName === 'DIV') {
          document.getElementById('fileInput').click();
        }
      });
    </script>
  </body>
</html>
