<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project - CVisionAI</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="../static/css/main.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --bg-light: #f8fafc;
            --danger: #ef4444;
            --highlight: rgba(79, 70, 229, 0.2);
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
            font-size: 0.875rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            transition: all 0.2s;
            background-color: #fff;
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        
        .has-error .form-control {
            border-color: var(--danger);
        }
        
        .text-danger {
            color: var(--danger);
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: block;
        }
        
        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.9375rem;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
        }
        
        .btn-outline-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        
        .btn-outline-secondary:hover {
            background: var(--bg-light);
            border-color: #cbd5e1;
        }
        
        .form-actions {
            padding: 1.5rem 0;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
        
        /* Responsive form grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        
        @media (min-width: 768px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .form-group.full-width {
                grid-column: 1 / -1;
            }
        }
        
        /* Responsive utilities */
        .d-flex {
            display: flex;
        }
        
        .justify-content-between {
            justify-content: space-between;
        }
        
        .align-items-center {
            align-items: center;
        }
        
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 1rem; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mb-5 { margin-bottom: 2rem; }
        
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 1rem; }
        .mt-4 { margin-top: 1.5rem; }
        .mt-5 { margin-top: 2rem; }
        
        .text-muted {
            color: var(--text-muted);
        }
        
        .text-center {
            text-align: center;
        }
        
        /* Responsive images */
        .img-fluid {
            max-width: 100%;
            height: auto;
        }
        
        /* Responsive iframes */
        .embed-responsive {
            position: relative;
            display: block;
            width: 100%;
            padding: 0;
            overflow: hidden;
        }
        
        .embed-responsive::before {
            display: block;
            content: "";
            padding-top: 56.25%; /* 16:9 aspect ratio */
        }
        
        .embed-responsive-item {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        
        /* Responsive utilities */
        .w-100 {
            width: 100%;
        }
        
        /* Responsive typography */
        h1, .h1 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }
        
        @media (min-width: 768px) {
            h1, .h1 {
                font-size: 2.5rem;
            }
        }
        
        /* Responsive tables */
        .table-responsive {
            display: block;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .table {
            width: 100%;
            margin-bottom: 1rem;
            color: #212529;
            border-collapse: collapse;
        }
        
        .table th,
        .table td {
            padding: 0.75rem;
            vertical-align: top;
            border-top: 1px solid #dee2e6;
        }
        
        .table thead th {
            vertical-align: bottom;
            border-bottom: 2px solid #dee2e6;
        }
        
        .table tbody + tbody {
            border-top: 2px solid #dee2e6;
        }
        
        /* Responsive images */
        .img-thumbnail {
            padding: 0.25rem;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            max-width: 100%;
            height: auto;
        }
            background: #eef2ff;
        }
    </style>
</head>
<body>
<div class="builder-layout">
    <aside class="sidebar">
        <div class="logo" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 2rem;">CVisionAI</div>
        <ul class="progress-list">
                <li class="progress-item completed"><span class="progress-dot">✓</span><span>Upload</span></li>
                <li class="progress-item completed"><span class="progress-dot">✓</span><span>Basics</span></li>
                <li class="progress-item completed"><span class="progress-dot">✓</span><span>Experience</span></li>
                <li class="progress-item completed"><span class="progress-dot">✓</span><span>Education</span></li>
                <li class="progress-item completed"><span class="progress-dot">✓</span><span>Skills</span></li>
                <li class="progress-item completed"><span class="progress-dot">✓</span><span>Summary</span></li>
                <li class="progress-item active"><span class="progress-dot">7</span><span>Projects</span></li>
                <li class="progress-item"><span class="progress-dot">8</span><span>Certificates</span></li>
                <li class="progress-item"><span class="progress-dot">9</span><span>Achievements</span></li>
                <li class="progress-item"><span class="progress-dot">10</span><span>Finalize</span></li>
        </ul>
        <div style="margin-top: auto; padding: 1rem; background: #334155; border-radius: 0.5rem; display: flex; align-items: center; gap: 1rem;">
             <div style="position: relative; width: 40px; height: 40px;">
                 <svg viewBox="0 0 36 36" style="transform: rotate(-90deg);">
                     <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#475569" stroke-width="3" />
                     <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="72, 100" />
                 </svg>
                 <span style="position: absolute; top:50%; left:50%; transform: translate(-50%, -50%); font-size: 0.7rem; font-weight: bold;">72%</span>
             </div>
             <div style="font-size: 0.75rem;">Resume complete</div>
         </div>
    </aside>
    <main class="builder-main">
        <div class="mb-5">
            <h1 class="mb-1" th:text="${project.id != null} ? 'Edit Project' : 'Add Project'">Add Project</h1>
            <p class="text-muted">Fill in the details about your project</p>
        </div>
        <form class="form-grid" th:action="@{/builder/projects/save}" th:object="${project}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label for="title">Project Title *</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
            </div>

            <div class="form-group">
                <label for="client">Client / Organization</label>
                <input type="text" class="form-control" id="client" th:field="*{client}">
            </div>
            
            <div class="form-group">
                <label for="duration">Duration</label>
                <input type="text" class="form-control" id="duration" th:field="*{duration}" placeholder="e.g., 3 months, Jan 2023 - Mar 2023">
            </div>
            
            <div class="form-group">
                <label for="role">Your Role</label>
                <input type="text" class="form-control" id="role" th:field="*{role}">
            </div>

            <div class="form-group">
                <label for="description">Description (Brief)</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3" maxlength="500"></textarea>
            </div>
            
            <!-- Responsibilities List -->
            <div class="form-group">
                <label>Key Responsibilities</label>
                <div id="respContainer">
                     <div class="d-flex mb-2" th:each="resp : ${project.responsibilities != null ? project.responsibilities : T(java.util.Collections).emptyList()}">
                        <input type="text" class="form-control me-2" th:name="responsibilities" th:value="${resp}">
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.parentNode.remove()"><i class="bi bi-trash"></i></button>
                     </div>
                </div>
                 <button type="button" class="btn-modern btn-modern-secondary mt-2" onclick="addResp()">
                    <i class="bi bi-plus-circle"></i> Add Responsibility
                </button>
            </div>

            <div class="form-actions mt-5 pt-4 border-top d-flex justify-content-between align-items-center">
                <div>
                    <a th:href="@{/builder/projects/list}" class="btn-modern btn-modern-secondary">
                        <i class="bi bi-arrow-left"></i> Back to List
                    </a>
                </div>
                <div class="d-flex gap-3">
                    <button type="submit" name="action" value="saveAndAddAnother" class="btn-modern btn-modern-outline">
                        <i class="bi bi-plus-circle"></i> Save & Add Another
                    </button>
                    <button type="submit" name="action" value="saveAndContinue" class="btn-modern btn-modern-primary">
                        <i class="bi bi-check-lg"></i> Save & Continue
                    </button>
                </div>
            </div>
        </form>
        
        <script>
            // Initialize tooltips
            document.addEventListener("DOMContentLoaded", function () {
                var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                    return new bootstrap.Tooltip(tooltipTriggerEl);
                });
                
                // Initialize date pickers if needed
                if (typeof flatpickr !== 'undefined') {
                    flatpickr("[data-datepicker]", {
                        dateFormat: "Y-m-d",
                        allowInput: true
                    });
                }
            });
            
            // Add responsibility field
            function addResp() {
                const container = document.getElementById('responsibilitiesContainer');
                const row = document.createElement('div');
                row.className = 'd-flex mb-2';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.name = 'responsibilities';
                input.className = 'form-control';
                input.placeholder = 'Enter responsibility';
                
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn btn-outline-danger ms-2';
                removeBtn.innerHTML = '<i class="bi bi-x"></i>';
                removeBtn.onclick = function() {
                    row.remove();
                };
                
                row.appendChild(input);
                row.appendChild(removeBtn);
                container.appendChild(row);
                
                // Focus the new input
                input.focus();
            }
            
            // Toggle preview function
            function togglePreview() {
                const previewDrawer = document.getElementById('previewDrawer');
                const previewOverlay = document.getElementById('previewOverlay');
                previewDrawer.classList.toggle('show');
                previewOverlay.classList.toggle('show');
                
                if (previewDrawer.classList.contains('show')) {
                    updatePreview();
                }
            }
            
            // Update preview with form data
            function updatePreview() {
                // Implement preview update logic here
                // This would update the preview drawer with the current form values
            }
            
            // Save form
            function saveForm(exitAfterSave = false) {
                const form = document.getElementById('projectForm');
                // Add any additional form validation here
                
                form.submit();
                
                if (exitAfterSave) {
                    // Redirect to list view after save
                    window.location.href = '/builder/projects';
                }
            }
            
            // Add skill tag
            function addSkill() {
                const skillInput = document.getElementById('skillInput');
                const skillsContainer = document.getElementById('skillsContainer');
                
                if (skillInput.value.trim() === '') return;
                
                const skillTag = document.createElement('span');
                skillTag.className = 'skill-tag';
                skillTag.innerHTML = `
                    ${skillInput.value}
                    <input type="hidden" name="skills" value="${skillInput.value}">
                    <button type="button" class="btn-close ms-1" onclick="this.parentElement.remove()" style="font-size: 0.5rem;"></button>
                `;
                
                skillsContainer.appendChild(skillTag);
                skillInput.value = '';
                skillInput.focus();
            }
            
            // Handle skill input keypress
            document.getElementById('skillInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addSkill();
                }
            });
        </script>
    </main>
</div>
</body>
</html>
