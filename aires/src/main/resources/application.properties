spring.application.name=SmartResumeBuilder

# Groq Cloud AI Configuration (via OpenAI-compatible API)
spring.ai.openai.api-key=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
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.3

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf
spring.thymeleaf.cache=false

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=cvision_resumes
spring.data.mongodb.auto-index-creation=true
# Date/Time Format
spring.mvc.format.date=MM/yyyy
spring.jackson.date-format=MM/yyyy
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false

spring.data.mongodb.auto-create-indexes=true
spring.data.mongodb.auto-index-creation-drop-duplicates=true